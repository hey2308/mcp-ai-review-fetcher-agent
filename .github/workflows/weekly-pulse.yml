name: Weekly Groww Pulse

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly pipeline (Phases 1–4)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MCP_SERVER_URL: ${{ vars.MCP_SERVER_URL }}
          EMAIL_ALIAS: ${{ vars.EMAIL_ALIAS }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
        run: python run_pipeline.py

      - name: Commit weekly artifacts
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews_raw.json data/processed_signal.json data/weekly_pulse.md data/output_links.json data/run_log.json
          if git diff --staged --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "Weekly pulse run $(date -u +%Y-%m-%d)"
            git push
          fi
